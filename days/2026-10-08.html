<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语精读 · 2026-10-08 · Scotland's first AI teacher</title>
<style>body{font-family:system-ui;margin:40px;color:#333}.err{color:#a00}</style></head>
<body><p id="s">加载中…</p>
<script>
(async function(){
  var base='https://raw.githubusercontent.com/asuka832/kaoyan-en-reading/main/days/2026-10-08.p';
  var n=8;
  var v='?v=20261008d';
  try{
    var parts=[];
    for(var i=0;i<n;i++){
      var r=await fetch(base+i+'.txt'+v);
      if(!r.ok) throw new Error('part '+i+' HTTP '+r.status);
      parts.push(await r.text());
    }
    document.open();document.write(parts.join(''));document.close();
  }catch(e){
    var el=document.getElementById('s');
    el.className='err';
    el.innerHTML='加载失败：'+e+'<br>备用：<a href="https://cdn.jsdelivr.net/gh/asuka832/kaoyan-en-reading@main/days/2026-10-08.html?v=20261008">jsDelivr</a>';
  }
})();
</script></body></html>
